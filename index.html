<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FPL Hafid — تحليل الفرق</title>
    <style>
      body { font-family: Tahoma, Arial, sans-serif; background:#f8fafc; color:#0f172a; padding:20px; }
      .container{max-width:960px;margin:0 auto}
      .card { background:white; border-radius:8px; padding:16px; box-shadow:0 2px 8px rgba(2,6,23,0.06); margin-bottom:16px }
      label{display:block;margin-bottom:6px}
      input[type=text]{width:100%;padding:8px;border:1px solid #e6eef6;border-radius:6px}
      button{background:#4f46e5;color:#fff;padding:8px 12px;border:none;border-radius:6px;cursor:pointer}
      .player { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #eef2f7 }
      .player:last-child{border-bottom:none}
      .muted{color:#64748b}
    </style>
  </head>
  <body>
    <div class="container">
      <h1 style="text-align:center;margin-bottom:12px">FPL Hafid — تحليل فريق Fantasy Premier League</h1>

      <div class="card">
        <label for="teamId">أدخل معرّف الفريق (Team ID)</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="teamId" type="text" placeholder="مثال: 2281" />
          <button id="fetchBtn">جلب وتحليل</button>
        </div>
        <div class="muted" style="margin-top:8px;">أدخل معرّف الفريق ثم اضغط جلب. الموقع يجلب بيانات مباشرة من واجهة FPL.</div>
      </div>

      <div id="result"></div>

      <div class="card muted" style="font-size:13px">ملاحظة: لتحسين الاعتمادية أستخدم وكيل CORS عام (proxy). إذا واجهت خطأ عدّ لتجربة لاحقاً أو اطلب مني نشر نسخة على Vercel لخدمة أكثر استقراراً.</div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
